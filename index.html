<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Circuit Drive</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#07121a;color:white;font-family:Arial}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:16px;left:16px;display:flex;gap:9px;pointer-events:none}.card{min-width:105px;padding:8px 12px;background:#07131ddd;border:1px solid #8ceeff99;border-radius:9px;font-size:11px;font-weight:bold;letter-spacing:.7px}.card b{display:block;margin-top:3px;color:#9af0ff;font-size:20px;letter-spacing:0}#help{position:fixed;right:17px;bottom:14px;text-align:right;font-size:12px;line-height:1.55;text-shadow:0 1px 2px #000;pointer-events:none}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:radial-gradient(ellipse,#103a4d88,#000c)}.hide{display:none!important}.panel{max-width:610px;padding:34px 40px;background:#08131fee;border:1px solid #85efffaa;border-radius:20px;box-shadow:0 18px 72px #000c}h1{margin:0 0 8px;font-size:clamp(38px,8vw,68px);letter-spacing:3px;text-shadow:0 0 18px #35cfff}h2{margin:0 0 16px;color:#85eeff;font-size:19px;letter-spacing:2px}p{line-height:1.55;color:#d9ebef}button{margin-top:13px;padding:13px 26px;border:1px solid #d0ffff;border-radius:8px;background:#1ba9cf;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:hover{background:#36c7eb}kbd{padding:1px 6px;border:1px solid #c5e5edaa;border-radius:4px;background:#ffffff18;font-weight:bold}.bad{color:#ff7b8d}.good{color:#a8ff9a}
</style></head><body>
<canvas id="game" width="1920" height="997"></canvas><div id="hud" class=""><div class="card">TIME LEFT<b>20.0s</b></div><div class="card">DODGED<b>27</b></div></div><div id="help">STEER: <b>WASD</b> or <b>ARROW KEYS</b><br>AVOID ONCOMING CARS</div><div id="overlay" class=""><div class="panel"><h2 class="good">SAFE ARRIVAL</h2><h1>YOU MADE IT!</h1><p>You drove safely for <b>20 seconds</b>. You dodged <b>27</b> cars.</p><button id="again">DRIVE AGAIN</button><p>or press <kbd>Enter</kbd></p></div></div>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),h=document.querySelector('#hud'),o=document.querySelector('#overlay'),K={},LIMIT=20;let W,H,d=1,last=0,state='title',startAt,spawnAt,dodges,obs,me,rx,rw,audio;if(!x){o.innerHTML='<div class="panel"><p>Open in Google Chrome.</p></div>';return}
function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);rw=Math.min(W*.72,580);rx=(W-rw)/2}addEventListener('resize',rs);rs();addEventListener('keydown',e=>{let k=e.key.toLowerCase();K[k]=1;if(['arrowleft','arrowright',' '].includes(k))e.preventDefault();if(e.key==='Enter'&&state!=='playing')go()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
function tone(f,t,type='sine',v=.07,slide=0){if(!audio)return;let q=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;q.type=type;q.frequency.setValueAtTime(f,n);q.frequency.linearRampToValueAtTime(Math.max(40,f+slide),n+t);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);q.connect(g).connect(audio.destination);q.start(n);q.stop(n+t)}function dodge(){tone(780,.07,'square',.04,250);setTimeout(()=>tone(1120,.07,'square',.04,160),65)}function crash(){tone(100,.22,'sawtooth',.16,-55);setTimeout(()=>tone(55,.42,'square',.13,-10),90)}function winS(){tone(520,.1,'sine',.07,120);setTimeout(()=>tone(760,.12,'sine',.07,160),115);setTimeout(()=>tone(1040,.2,'sine',.08,240),250)}
function car(X,Y,w,hh,col,up){x.save();x.translate(X,Y);if(up)x.rotate(Math.PI);x.fillStyle='#0008';x.fillRect(-w*.43,-hh*.43,w,hh);x.fillStyle=col;x.beginPath();if(x.roundRect)x.roundRect(-w/2,-hh/2,w,hh,10);else x.rect(-w/2,-hh/2,w,hh);x.fill();x.fillStyle='#b7edff';x.fillRect(-w*.29,-hh*.22,w*.58,hh*.27);x.fillStyle=up?'#ffec9b':'#ff3e5c';x.fillRect(-w*.29,-hh*.45,w*.18,hh*.07);x.fillRect(w*.11,-hh*.45,w*.18,hh*.07);x.restore()}
function go(){let A=window.AudioContext||window.webkitAudioContext;if(A&&!audio)audio=new A();if(audio&&audio.state==='suspended')audio.resume();state='playing';startAt=performance.now();spawnAt=startAt;dodges=0;obs=[];me={x:W/2,y:H*.79,w:Math.max(46,rw*.13),h:Math.max(84,rw*.23)};h.classList.remove('hide');o.classList.add('hide')}
function spawn(now){let hard=Math.min(1,(now-startAt)/20000),m=me.w*.62;obs.push({x:rx+m+Math.random()*(rw-m*2),y:-100,w:me.w*.92,h:me.h*.9,v:330+hard*210+Math.random()*90,done:0,col:['#ff596e','#ffc94e','#a584ff','#4de3c1'][Math.floor(Math.random()*4)]});spawnAt=now+620-hard*160+Math.random()*330}function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.42&&Math.abs(a.y-b.y)<(a.h+b.h)*.42}
function end(ok){state=ok?'won':'over';if(ok)winS();else{crash();setTimeout(()=>tone(180,.18,'sawtooth',.09,-110),180)}o.innerHTML='<div class="panel"><h2 class="'+(ok?'good':'bad')+'">'+(ok?'SAFE ARRIVAL':'ACCIDENT!')+'</h2><h1>'+(ok?'YOU MADE IT!':'GAME OVER')+'</h1><p>'+(ok?'You drove safely for <b>20 seconds</b>. ':'')+'You dodged <b>'+dodges+'</b> car'+(dodges===1?'':'s')+'.</p><button id="again">'+(ok?'DRIVE AGAIN':'TRY AGAIN')+'</button><p>or press <kbd>Enter</kbd></p></div>';o.classList.remove('hide');document.querySelector('#again').onclick=go}
function update(now,dt){if(state!=='playing')return;let e=(now-startAt)/1000;if(e>=LIMIT){end(1);return}let turn=(K.a||K.arrowleft?-1:0)+(K.d||K.arrowright?1:0);me.x+=turn*(360+e*8)*dt;me.x=Math.max(rx+me.w*.52,Math.min(rx+rw-me.w*.52,me.x));if(now>=spawnAt)spawn(now);for(let i=obs.length-1;i>=0;i--){let b=obs[i];b.y+=b.v*dt;if(hit(me,b)){end(0);return}if(!b.done&&b.y>me.y+me.h*.65){b.done=1;dodges++;dodge()}if(b.y>H+120)obs.splice(i,1)}}
function road(now){x.fillStyle='#113c2d';x.fillRect(0,0,W,H);x.fillStyle='#315a38';for(let y=-80;y<H+80;y+=88)x.fillRect(0,y,W,4);x.fillStyle='#e5e9e8';x.fillRect(rx-9,0,9,H);x.fillRect(rx+rw,0,9,H);x.fillStyle='#3e4b51';x.fillRect(rx,0,rw,H);x.setLineDash([34,32]);x.lineWidth=5;x.strokeStyle='#ffeaa5bb';for(let l=1;l<3;l++){x.beginPath();x.moveTo(rx+rw*l/3,-60+(now*.22%66));x.lineTo(rx+rw*l/3,H+60);x.stroke()}x.setLineDash([])}function draw(now){x.clearRect(0,0,W,H);road(now);if(me){obs.forEach(b=>car(b.x,b.y,b.w,b.h,b.col,1));car(me.x,me.y,me.w,me.h,'#39d8ff');let t=Math.max(0,LIMIT-(state==='playing'?(now-startAt)/1000:0));h.innerHTML='<div class="card">TIME LEFT<b>'+t.toFixed(1)+'s</b></div><div class="card">DODGED<b>'+dodges+'</b></div>'}}function loop(now){let dt=Math.min(.033,(now-last||16)/1000);last=now;update(now,dt);draw(now);requestAnimationFrame(loop)}
o.innerHTML='<div class="panel"><h1>NEON CIRCUIT DRIVE</h1><h2>20-SECOND SURVIVAL RUN</h2><p>Steer around oncoming cars. One accident ends the drive—make it safely through all 20 seconds.</p><p><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> to steer<br>Sound effects begin when you start.</p><button id="start">START DRIVE</button><p>or press <kbd>Enter</kbd></p></div>';document.querySelector('#start').onclick=go;requestAnimationFrame(loop)})();
</script>
</body></html>
